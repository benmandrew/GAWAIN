[package]
name = "gawain"
version = "0.1.0"
edition = "2021"
description = "Specification weakening against a model by genetic search"
publish = false

[[bin]]
name = "weaken"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"

# The lasso count is about 20 times slower unoptimised, which made the
# abp4 search test take 570 s; tests build with the dev profile.
[profile.dev]
opt-level = 2
